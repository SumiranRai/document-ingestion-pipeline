services:

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - ./schema.sql:/schema.sql
    command: ["postgres", "-c", "timezone=Asia/Kolkata"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CREATE_TOPICS: "documents.received:1:1,documents.extracted:1:1,documents.validated:1:1,documents.persisted:1:1,documents.failed:1:1,documents.dlq:1:1"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  airflow:
    image: apache/airflow:2.9.1
    container_name: airflow
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./app:/opt/airflow/app
      - ./requirements.txt:/requirements.txt
      - ./sample:/opt/airflow/sample
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres/airflow_db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      PYTHONPATH: /opt/airflow
      # Pipeline database (separate from Airflow metadata)
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: pipeline_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DOCUMENT_INGESTION_PATH: /opt/airflow/sample
      OCR_API_KEY: K84310118688957
      LOG_LEVEL: INFO
    command: >
      bash -c "
        pip install kafka-python-ng psycopg2-binary pdfplumber pillow openpyxl python-dotenv pandas numpy requests --quiet &&
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com 2>&1 | true &&
        rm -f /opt/airflow/airflow-webserver.pid &&
        airflow scheduler &
        exec airflow webserver --port 8080
      "

  streamlit:
    image: python:3.11-slim
    container_name: streamlit
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    environment:
      PYTHONPATH: /app
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: pipeline_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DOCUMENT_INGESTION_PATH: /app/sample
      OCR_API_KEY: K84310118688957
    command: >
      bash -c "
        pip install streamlit plotly pandas psycopg2-binary --quiet &&
        streamlit run /app/app_streamlit.py --server.port=8501 --server.address=0.0.0.0
      "

  kafka-event-logger:
    image: python:3.11-slim
    container_name: kafka-event-logger
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./:/app
    environment:
      PYTHONPATH: /app
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: pipeline_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: >
      bash -c "
        pip install kafka-python-ng psycopg2-binary --quiet &&
        python -m app.kafka.event_logger
      "
    restart: on-failure

  kafka-dlq-consumer:
    image: python:3.11-slim
    container_name: kafka-dlq-consumer
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./:/app
    environment:
      PYTHONPATH: /app
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: pipeline_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DLQ_MAX_RETRIES: "3"
      DLQ_RETRY_DELAY_SEC: "30"
    command: >
      bash -c "
        pip install kafka-python-ng psycopg2-binary --quiet &&
        python -m app.kafka.dlq_consumer
      "
    restart: on-failure

volumes:
  postgres_data:
